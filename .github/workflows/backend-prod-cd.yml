name: Backend CD to EC2 for prod

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches: [ "develop-be", "feat/#727-ssm-deploy-script" ]
#  push:
#    branches: [ "release" ]
#    paths:
#      - 'backend/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Upload Artifact
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_TEST_USER_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        ports:
          - 13307:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_TEST_USER_PASSWORD: ${{ secrets.MYSQL_TEST_USER_PASSWORD }}
      TEST_MYSQL_PORT: ${{ secrets.TEST_MYSQL_PORT }}
      DB_MYSQL_HOST: ${{ secrets.DB_MYSQL_HOST }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_WRITER_ENDPOINT: ${{ secrets.MYSQL_WRITER_ENDPOINT }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build executable Spring Boot jar
        working-directory: backend
        run: ./gradlew clean :boot:bootJar

      - name: Rename jar with timestamp
        working-directory: backend/boot/build/libs
        run: |
          TS=$(date +"%Y%m%d-%H%M%S")
          JAR_NAME=$(find . -name "*.jar" ! -name "*-plain.jar")
          NEW_NAME="app-${TS}.jar"
          mv "$JAR_NAME" "$NEW_NAME"
          echo "NEW_JAR_NAME=$NEW_NAME" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Upload jar to S3
        run: |
          aws s3 cp backend/boot/build/libs/${{ env.NEW_JAR_NAME }} \
            s3://hearit-artifacts/prod/${{ env.NEW_JAR_NAME }}

  deploy:
    name: Deploy on EC2 for prod
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy using SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.PROD_EC2_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy hEARit backend" \
            --parameters "commands=[
              \"aws s3 cp s3://hearit-artifacts/prod/${{ env.NEW_JAR_NAME }} /home/ubuntu/hearit/app.jar\",
              \"sudo bash /home/ubuntu/hearit/deploy.sh\"
            ]" \
            --region ap-northeast-2
