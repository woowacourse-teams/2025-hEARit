name: Hearit Android dev CD

on:
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'android/**'

env:
  LOCAL_PROPERTIES_CONTENTS: ${{ secrets.LOCAL_PROPERTIES_CONTENTS }}
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "$LOCAL_PROPERTIES_CONTENTS" > ./local.properties

      - name: Get Google Services JSON
        run: echo "$GOOGLE_SERVICES_JSON" > ./app/google-services.json

      - name: Build Debug apk
        run: ./gradlew assembleDebug

      # 버전코드 구하기 (Gradle에서 직접 읽기)
      - name: Extract versionCode from Gradle
        id: version
        run: |
          VERSION_CODE=$(./gradlew -q :app:printVersionCode)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      # APK 이름 바꾸기
      - name: Rename APK with version code
        run: |
          mv ./app/build/outputs/apk/debug/hEARit-debug.apk \
             ./app/build/outputs/apk/debug/hEARit-dev-${VERSION_CODE}.apk

      - name: Upload a Build APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hEARit-dev-${{ env.VERSION_CODE }}.apk
          path: ./android/app/build/outputs/apk/debug/hEARit-dev-${{ env.VERSION_CODE }}.apk
          overwrite: 'true'

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: hearit-test
          releaseNotesFile: ./android/app/whatsnew/whatsnew-ko-KR
          file: ./android/app/build/outputs/apk/debug/hEARit-dev-${{ env.VERSION_CODE }}.apk
