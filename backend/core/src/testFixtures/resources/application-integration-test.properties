# secret import
spring.config.import=optional:file:../.env[.properties]

# DataSource
# ==================================
# Master (Primary)
# ==================================
spring.datasource.master.jdbc-url=jdbc:mysql://${MYSQL_WRITER_ENDPOINT}:${TEST_MYSQL_PORT}/${MYSQL_DATABASE}?rewriteBatchedStatements=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.master.username=root
spring.datasource.master.password=${MYSQL_TEST_USER_PASSWORD}
spring.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================
# Replica
# ==================================
spring.datasource.replica.jdbc-url=jdbc:mysql://${MYSQL_WRITER_ENDPOINT}:${TEST_MYSQL_PORT}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.replica.username=root
spring.datasource.replica.password=${MYSQL_TEST_USER_PASSWORD}
spring.datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver

# Dev-JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# kakao base-url
kakao.user-info.base-url=https://kapi.kakao.com
kakao.user-info.connectTimeout=2000
kakao.user-info.readTimeout=3000

# Jwt
jwt.secret=test-example-jwt-secret-test-example-jwt-secret
jwt.access-token.expiration=100000
jwt.refresh-token.expiration=600000

# user-default-image
hearit.profile.default-image-url=http://hearit.o-r.kr/images/default-profile.jpg

# S3
aws.region=fake-region
aws.s3.bucket.url=https://test.com
aws.s3.bucket=fake-bucket
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-part-count=30

## Flyaway
spring.flyway.url=${spring.datasource.master.jdbc-url}
spring.flyway.user=root
spring.flyway.password=root

app.version=test

# Redis (use local Docker Redis with credentials from .env)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms

# Redisson
redisson.timeout=500
redisson.connect-timeout=500
redisson.retry-attempts=1
redisson.retry-interval=100

# Playing History Lock
playing-history.lock.wait-time=10
playing-history.lock.lease-time=100

# Circuit Breaker (Resilience4j)
resilience4j.circuitbreaker.configs.default.slidingWindowSize=4
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=1s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=100
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=2s
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.redisBuffer.baseConfig=default
resilience4j.circuitbreaker.instances.redisBuffer.recordExceptions=com.onair.hearit.app.exception.custom.RedisBufferException

# ==================================
# AI Processing (Test Configuration)
# ==================================
# Groq API (무료 Whisper STT)
groq.api.key=test-groq-api-key
groq.whisper.model=whisper-large-v3-turbo

# Gemini API (대본 교정 + 메타데이터 생성)
gemini.api.key=test-gemini-api-key
gemini.model=gemini-2.0-flash

# AI 처리 설정
ai.result.expiration.hours=24
ai.shorts.duration.seconds=60
ai.max-file-size-mb=25

# S3 임시 경로
aws.s3.temp.prefix=hearit/temp/
