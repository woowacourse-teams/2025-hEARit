// core build.gradle
plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    configureEach {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

dependencies {
    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Lombok
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'

    // Flyway
    api "org.flywaydb:flyway-core"
    api "org.flywaydb:flyway-mysql"

    // elastic search
    api 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
    implementation 'org.springframework.retry:spring-retry'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testRuntimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.testcontainers:testcontainers:2.0.2"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:2.0.2"
    testImplementation "org.testcontainers:testcontainers-elasticsearch:2.0.2"

    testFixturesImplementation 'org.springframework.restdocs:spring-restdocs-restassured'
    testFixturesImplementation 'io.rest-assured:rest-assured:5.4.0'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named("bootJar") {
    enabled = false
}

tasks.named('jar') {
    enabled = true
}
