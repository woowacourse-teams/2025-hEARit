<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" th:href="@{/favicon.ico}">
    <title>관리자 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* 지난번과 동일한 커스텀 스타일 */
        .list-group-item h5 {
            margin-bottom: 0.25rem;
        }

        .list-group-item p {
            margin-bottom: 0;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .icon-text-gap {
            gap: 1rem; /* 아이콘과 텍스트 사이 간격 */
        }
    </style>
</head>
<body class="bg-light">
<div th:insert="~{admin/navbar :: navbar}"></div>

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom-0 pt-4 px-4">
            <h1 class="text-center">hEARit 관리자 페이지</h1>
        </div>
        <div class="card-body p-4">
            <p class="card-text text-center text-muted mb-4">아래 메뉴를 선택하여 작업을 시작하세요.</p>
            <div class="list-group">
                <a class="list-group-item list-group-item-action d-flex align-items-center icon-text-gap p-3"
                   th:href="@{/admin/hearits}">
                    <i class="bi bi-journals fs-3 text-info"></i>
                    <div>
                        <h5>히어릿 관리</h5>
                        <p>등록된 히어릿 목록을 조회하고 수정합니다.</p>
                    </div>
                </a>
                <a class="list-group-item list-group-item-action d-flex align-items-center icon-text-gap p-3"
                   th:href="@{/admin/hearits-create}">
                    <i class="bi bi-file-earmark-plus fs-3 text-success"></i>
                    <div>
                        <h5>히어릿 추가</h5>
                        <p>새로운 히어릿을 시스템에 추가합니다.</p>
                    </div>
                </a>
                <a class="list-group-item list-group-item-action d-flex align-items-center icon-text-gap p-3"
                   th:href="@{/admin/ai-upload}">
                    <i class="bi bi-robot fs-3 text-purple" style="color: #8b5cf6;"></i>
                    <div>
                        <h5>AI 콘텐츠 생성</h5>
                        <p>오디오 파일을 업로드하면 AI가 자동으로 콘텐츠를 생성합니다.</p>
                    </div>
                </a>
                <a class="list-group-item list-group-item-action d-flex align-items-center icon-text-gap p-3"
                   th:href="@{/admin/categories}">
                    <i class="bi bi-tags fs-3 text-primary"></i>
                    <div>
                        <h5>카테고리 관리</h5>
                        <p>히어릿에 사용될 카테고리를 관리합니다.</p>
                    </div>
                </a>
                <a class="list-group-item list-group-item-action d-flex align-items-center icon-text-gap p-3"
                   th:href="@{/admin/keywords}">
                    <i class="bi bi-key fs-3 text-warning"></i>
                    <div>
                        <h5>키워드 관리</h5>
                        <p>검색 및 분류에 사용될 키워드를 관리합니다.</p>
                    </div>
                </a>
                <a class="list-group-item list-group-item-action d-flex align-items-center icon-text-gap p-3"
                   th:href="@{/admin/recommend-hearit}">
                    <i class="bi bi-star-fill fs-3 text-danger"></i>
                    <div>
                        <h5>오늘의 추천 히어릿</h5>
                        <p>오늘의 추천 히어릿을 선정하고 관리합니다.</p>
                    </div>
                </a>
                <a class="list-group-item list-group-item-action d-flex align-items-center icon-text-gap p-3"
                   th:href="@{/admin/elastic-search}">
                    <i class="bi bi-bar-chart-steps fs-3"></i>
                    <div>
                        <h5>Elasticsearch</h5>
                        <p>Elasticsearch를 관리합니다. </p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
