<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI 콘텐츠 생성 - Hearit Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        .upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #0d6efd;
            background-color: #e7f1ff;
        }
        .upload-area i {
            font-size: 48px;
            color: #6c757d;
        }
        .process-steps {
            list-style: none;
            padding: 0;
        }
        .process-steps li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .process-steps li .icon {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }
        .process-steps li.active {
            color: #0d6efd;
            font-weight: 500;
        }
        .process-steps li.completed .icon {
            color: #198754;
        }
    </style>
</head>
<body>
<div th:insert="~{admin/navbar :: navbar}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1><i class="bi bi-robot"></i> AI 콘텐츠 생성</h1>
    </div>

    <!-- 1. 파일 업로드 영역 -->
    <section id="upload-section" class="card card-body mb-4">
        <div class="upload-area" id="drop-zone">
            <i class="bi bi-cloud-arrow-up"></i>
            <h5 class="mt-3">NotebookLM에서 생성한 오디오 파일을 업로드하세요</h5>
            <p class="text-muted mb-3">지원 형식: MP3, M4A, AAC (최대 25MB)</p>
            <input type="file" id="audio-file" accept=".mp3,.m4a,.aac,audio/mpeg,audio/mp4,audio/aac" class="d-none" />
            <button type="button" class="btn btn-primary" id="select-file-btn">
                <i class="bi bi-folder2-open"></i> 파일 선택
            </button>
        </div>

        <div id="file-preview" class="mt-3 d-none">
            <div class="d-flex align-items-center justify-content-between p-3 bg-light rounded">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-file-earmark-music fs-4 text-primary"></i>
                    <div>
                        <div class="fw-bold" id="file-name"></div>
                        <small class="text-muted" id="file-size"></small>
                    </div>
                </div>
                <button type="button" class="btn btn-outline-danger btn-sm" id="remove-file-btn">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>

        <div class="mt-3">
            <button id="start-process" class="btn btn-success btn-lg w-100" disabled>
                <i class="bi bi-play-circle"></i> AI 처리 시작
            </button>
        </div>
    </section>

    <!-- 2. 처리 진행 상황 -->
    <section id="progress-section" class="card card-body mb-4 d-none">
        <h5 class="mb-3"><i class="bi bi-gear-wide-connected"></i> AI 처리 중...</h5>

        <div class="progress mb-3" style="height: 25px;">
            <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
                 role="progressbar" style="width: 0%">
                <span id="progress-text">0%</span>
            </div>
        </div>

        <ul class="process-steps" id="process-steps">
            <li data-step="UPLOADING">
                <span class="icon"><i class="bi bi-hourglass"></i></span>
                <span>파일 업로드</span>
            </li>
            <li data-step="CONVERTING">
                <span class="icon"><i class="bi bi-hourglass"></i></span>
                <span>오디오 변환 (쇼츠 생성)</span>
            </li>
            <li data-step="TRANSCRIBING">
                <span class="icon"><i class="bi bi-hourglass"></i></span>
                <span>음성 인식 (STT) - 1~2분 소요</span>
            </li>
            <li data-step="CORRECTING">
                <span class="icon"><i class="bi bi-hourglass"></i></span>
                <span>대본 교정</span>
            </li>
            <li data-step="GENERATING_META">
                <span class="icon"><i class="bi bi-hourglass"></i></span>
                <span>메타데이터 생성</span>
            </li>
        </ul>

        <div id="error-message" class="alert alert-danger d-none mt-3">
            <i class="bi bi-exclamation-triangle"></i>
            <span id="error-text"></span>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/ai-upload.js}"></script>
</body>
</html>
