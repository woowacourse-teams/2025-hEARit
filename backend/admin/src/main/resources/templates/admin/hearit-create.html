<!DOCTYPE html>
<link rel="stylesheet" th:href="@{/css/hearit-create.css}">
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>히어릿 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:insert="~{admin/navbar :: navbar}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>컨텐츠 추가</h1>
    </div>

    <div id="upload-section" class="card card-body mb-4" style="display: block;">
        <form id="upload-form">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                    <div class="text-end small mt-1">
                        <span id="title-count" class="text-muted">0 / 35</span>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">출처</label>
                <div id="sources-container">
                </div>
                <button type="button" class="btn btn-outline-secondary btn-sm mt-2" id="add-source-btn">출처 추가</button>
            </div>
            <div class="mb-3">
                <label for="summary" class="form-label">요약</label>
                <textarea class="form-control" id="summary" name="summary" rows="2"></textarea>
                <div class="text-end small mt-1">
                    <span id="summary-count" class="text-muted">0 / 250</span>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label for="audioFiles" class="form-label">파일 업로드</label>
                    <input type="file" class="form-control" id="audioFiles" multiple
                           accept="audio/mpeg,application/json" required>
                    <div class="form-text">
                        MP3 파일 2개 (원본 + 1분 요약)와 대본 JSON 파일을 함께 선택해주세요
                    </div>
                    <div id="file-preview" class="mt-2"></div>
                </div>
            </div>
            <input type="hidden" id="originalAudio" name="originalAudio">
            <input type="hidden" id="shortAudio" name="shortAudio">
            <input type="hidden" id="scriptFile" name="scriptFile">
            <input type="hidden" id="playTime" name="playTime">
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label for="categoryId" class="form-label">카테고리</label>
                    <select id="categoryId" name="categoryId" class="form-select" required>
                        <option value="" disabled selected>선택...</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-end mb-2">
                    <label class="form-label mb-0 fw-bold">키워드 선택</label>
                    <small class="text-primary fw-bold">
                        선택됨: <span id="selected-keyword-count">0</span>개
                    </small>
                </div>

                <div class="input-group mb-2">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" id="keyword-search" placeholder="등록할 키워드를 검색해 보세요...">
                </div>

                <div id="keyword-checkboxes"></div>

                <div class="d-flex justify-content-center mt-3">
                    <div id="keyword-pagination" class="btn-group shadow-sm"></div>
                </div>
            </div>
            <div id="button-container" class="d-flex gap-2">
                <button type="submit" class="btn btn-success" id="submit-btn">등록</button>
                <button type="button" class="btn btn-secondary" id="cancel-upload">취소</button>
            </div>
            <div id="progress-container" class="d-none mt-3">
                <div class="progress" style="height: 30px;">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
                         role="progressbar" style="width: 0%">
                        <span id="progress-text" class="fw-bold">준비 중...</span>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/hearit-create.js}"></script>
</body>
</html>
