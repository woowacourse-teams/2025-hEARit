<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>히어릿 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css">
    <style>
        /* 모달 내 폰트/크기 통일 */
        .modal { font-family: inherit; }
        .modal .source-group .form-control,
        .modal .source-group .btn { font-size: 1rem; font-family: inherit; }
        html, body { font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif; }
        .file-upload-form {
            margin-top: 8px;
        }

        .table th, .table td {
            vertical-align: middle;
        }
    </style>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:insert="~{admin/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>히어릿 관리</h1>
    </div>
    <div>
        <p id="hearit-count" class="text-muted mb-0">히어릿 총 개수: 0개</p>
    </div>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Title</th>
            <th scope="col">Summary</th>
            <th scope="col">Play Time</th>
            <th scope="col">Original Audio</th>
            <th scope="col">Short Audio</th>
            <th scope="col">Script</th>
            <th scope="col">Sources</th>
            <th scope="col">Created At</th>
            <th scope="col">Category</th>
            <th scope="col">Keywords</th>
            <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody id="hearit-table-body"></tbody>
    </table>
    <nav>
        <ul class="pagination justify-content-center" id="pagination-controls"></ul>
    </nav>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editHearitModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">히어릿 수정</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="edit-hearit-modal-body"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="cancelEditHearit()">취소</button>
                <button type="button" class="btn btn-success" id="edit-save-button">저장</button>
            </div>
        </div>
    </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentPage = 0;
    const pageSize = 15;
    let lastFetchedHearits = [];

    async function fetchHearits(page) {
        try {
            const response = await fetch(`/api/v1/admin/hearits?page=${page}&size=${pageSize}`);
            if (!response.ok) throw new Error('데이터를 불러오는 데 실패했습니다.');
            const pagedData = await response.json();
            updateTable(pagedData.content);
            updatePagination(pagedData);
            document.getElementById('hearit-count').textContent = `히어릿 총 개수: ${pagedData.totalElements}개`;
            lastFetchedHearits = pagedData.content || [];
            currentPage = page;
        } catch (error) {
            console.error('Error fetching hearits:', error);
            alert(error.message);
        }
    }

    let editingId = null;

    function updateTable(hearits) {
        const tableBody = document.getElementById('hearit-table-body');
        tableBody.innerHTML = '';
        hearits.forEach(hearit => {
            const row = document.createElement('tr');

            const sourcesHtml = Array.isArray(hearit.sources) && hearit.sources.length > 0
                ? hearit.sources.map(s => {
                    if (s.sourceUrl) { // URL이 있으면 링크로 표시
                        return `<a href="${s.sourceUrl}" target="_blank" rel="noopener noreferrer">${s.sourceName}</a>`;
                    } else { // URL이 없으면 텍스트로만 표시
                        return `<span>${s.sourceName}</span>`;
                    }
                }).join('<br>')
                : '없음';

            if (editingId === hearit.id) {
                const editSourcesHtml = `
                    <div id="edit-sources-container-${hearit.id}">
                        ${hearit.sources.map(s => `
                            <div class="input-group input-group-lg mb-2 source-group">
                                <input type="text" class="form-control source-name-input" value="${s.sourceName || ''}" placeholder="이름">
                                <input type="text" class="form-control source-url-input" value="${s.sourceUrl || ''}" placeholder="URL (선택사항)">
                                <button type="button" class="btn btn-outline-danger" onclick="this.closest('.source-group').remove()">삭제</button>
                            </div>
                        `).join('')}
                    </div>
                    <button type="button" class="btn btn-outline-primary btn-sm mt-1" onclick="addSourceRowToEdit(${hearit.id})">출처 추가</button>
                `;

                row.innerHTML = `
                    <td>
                        ${hearit.id}
                        <input type="hidden" id="original-audio-url-${hearit.id}" value="${hearit.originalAudioUrl || ''}">
                        <input type="hidden" id="short-audio-url-${hearit.id}" value="${hearit.shortAudioUrl || ''}">
                        <input type="hidden" id="script-url-${hearit.id}" value="${hearit.scriptUrl || ''}">
                    </td>
                    <td><input type="text" class="form-control" value="${hearit.title}" id="edit-title-${hearit.id}" style="min-width: 120px;"></td>
                    <td><input type="text" class="form-control" value="${hearit.summary || ''}" id="edit-summary-${hearit.id}" style="min-width: 120px;"></td>
                    <td><input type="number" class="form-control" value="${hearit.playTime}" id="edit-playtime-${hearit.id}" style="min-width: 120px;"></td>
                    <td>${hearit.originalAudioUrl || 'N/A'}</td>
                    <td>${hearit.shortAudioUrl || 'N/A'}</td>
                    <td>${hearit.scriptUrl || 'N/A'}</td>
                    <td>${editSourcesHtml}</td>
                    <td>${hearit.createdAt ? new Date(hearit.createdAt).toLocaleString() : ''}</td>
                    <td>
                        ${hearit.category?.name || ''}
                        <input type="hidden" id="edit-category-id-${hearit.id}" value="${hearit.category?.id || ''}">
                    </td>
                    <td>${
                    Array.isArray(hearit.keywords)
                        ? hearit.keywords.map(k => `<span class="badge text-bg-secondary me-1">${k.name}</span>`).join('')
                        : ''
                }</td>
                    <td>
                        <button class="btn btn-success btn-sm" onclick="updateMetadata(${hearit.id})">저장</button>
                        <button class="btn btn-secondary btn-sm" onclick="cancelEditHearit()">취소</button>
                    </td>
                `;
            } else {
                row.innerHTML = `
                    <td>${hearit.id}</td>
                    <td>${hearit.title}</td>
                    <td>${hearit.summary || ''}</td>
                    <td>${hearit.playTime}초</td>
                    <td>
                        <div>${hearit.originalAudioUrl || '없음'}</div>
                        <form class="file-upload-form" onsubmit="updateFile(event, ${hearit.id}, 'original-audio')">
                            <div class="input-group input-group-sm">
                                <input type="file" class="form-control" name="file" required>
                                <button class="btn btn-outline-secondary" type="submit">OriginalAudio 수정</button>
                            </div>
                        </form>
                    </td>
                    <td>
                        <div>${hearit.shortAudioUrl || '없음'}</div>
                        <form class="file-upload-form" onsubmit="updateFile(event, ${hearit.id}, 'short-audio')">
                            <div class="input-group input-group-sm">
                                <input type="file" class="form-control" name="file" required>
                                <button class="btn btn-outline-secondary" type="submit">ShortAudio 수정</button>
                            </div>
                        </form>
                    </td>
                    <td>
                        <div>${hearit.scriptUrl || '없음'}</div>
                        <form class="file-upload-form" onsubmit="updateFile(event, ${hearit.id}, 'script')">
                             <div class="input-group input-group-sm">
                                <input type="file" class="form-control" name="file" required>
                                <button class="btn btn-outline-secondary" type="submit">Script 수정</button>
                            </div>
                        </form>
                    </td>
                    <td>${sourcesHtml}</td>
                    <td>${hearit.createdAt ? new Date(hearit.createdAt).toLocaleString() : ''}</td>
                    <td>${hearit.category?.name || ''}</td>
                    <td>${
                    Array.isArray(hearit.keywords)
                        ? hearit.keywords.map(k => `<span class="badge text-bg-secondary me-1">${k.name}</span>`).join('')
                        : ''
                }</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editHearit(${hearit.id})">수정</button>
                    </td>
                `;
            }
            tableBody.appendChild(row);
        });
    }

    function updatePagination(pagedData) {
        const paginationControls = document.getElementById('pagination-controls');
        paginationControls.innerHTML = '';
        const createPageItem = (text, page, isDisabled = false, isActive = false) => {
            const li = document.createElement('li');
            li.className = `page-item ${isDisabled ? 'disabled' : ''} ${isActive ? 'active' : ''}`;
            const link = document.createElement('a');
            link.className = 'page-link';
            link.href = '#';
            link.textContent = text;
            if (!isDisabled) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    fetchHearits(page);
                });
            }
            li.appendChild(link);
            return li;
        };
        paginationControls.appendChild(createPageItem('이전', currentPage - 1, pagedData.isFirst));
        paginationControls.appendChild(createPageItem(`${pagedData.page + 1} / ${pagedData.totalPages}`, -1, true));
        paginationControls.appendChild(createPageItem('다음', currentPage + 1, pagedData.isLast));
    }

    function editHearit(hearitId) {
        const hearit = lastFetchedHearits.find(h => h.id === hearitId);
        if (!hearit) {
            alert('데이터를 불러오지 못했습니다. 다시 시도해주세요.');
            return;
        }
        editingId = hearitId;

        const sources = Array.isArray(hearit.sources) ? hearit.sources : [];
        const sourcesRowsHtml = (sources.length > 0 ? sources : [{ sourceName: '', sourceUrl: '' }])
            .map(s => `
                <div class="input-group input-group-lg mb-2 source-group">
                    <input type="text" class="form-control source-name-input" value="${s.sourceName || ''}" placeholder="이름">
                    <input type="text" class="form-control source-url-input" value="${s.sourceUrl || ''}" placeholder="URL (선택사항)">
                    <button type="button" class="btn btn-outline-danger" onclick="this.closest('.source-group').remove()">삭제</button>
                </div>
            `).join('');

        const modalBody = document.getElementById('edit-hearit-modal-body');
        modalBody.innerHTML = `
            <div class="container-fluid">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label">제목</label>
                        <input type="text" class="form-control" value="${hearit.title}" id="edit-title-${hearit.id}" style="min-width: 120px;">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label">재생시간(초)</label>
                        <input type="number" class="form-control" value="${hearit.playTime}" id="edit-playtime-${hearit.id}" style="min-width: 120px;">
                    </div>
                    <div class="col-12">
                        <label class="form-label">요약</label>
                        <input type="text" class="form-control" value="${hearit.summary || ''}" id="edit-summary-${hearit.id}" style="min-width: 120px;">
                    </div>
                    <div class="col-12">
                        <label class="form-label">출처</label>
                        <div id="edit-sources-container-${hearit.id}">
                            ${sourcesRowsHtml}
                        </div>
                        <button type="button" class="btn btn-outline-primary btn-sm mt-1" onclick="addSourceRowToEdit(${hearit.id})">출처 추가</button>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label">Original Audio</label>
                        <div>${hearit.originalAudioUrl || 'N/A'}</div>
                        <input type="hidden" id="original-audio-url-${hearit.id}" value="${hearit.originalAudioUrl || ''}">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label">Short Audio</label>
                        <div>${hearit.shortAudioUrl || 'N/A'}</div>
                        <input type="hidden" id="short-audio-url-${hearit.id}" value="${hearit.shortAudioUrl || ''}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Script</label>
                        <div>${hearit.scriptUrl || 'N/A'}</div>
                        <input type="hidden" id="script-url-${hearit.id}" value="${hearit.scriptUrl || ''}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">카테고리</label>
                        <div>${hearit.category?.name || ''}</div>
                        <input type="hidden" id="edit-category-id-${hearit.id}" value="${hearit.category?.id || ''}">
                    </div>
                </div>
            </div>
        `;

        const modalEl = document.getElementById('editHearitModal');
        const modal = new bootstrap.Modal(modalEl);
        document.getElementById('edit-save-button').onclick = () => updateMetadata(hearitId);
        modal.show();
    }

    function addSourceRowToEdit(hearitId) {
        const container = document.getElementById(`edit-sources-container-${hearitId}`);
        const newRow = document.createElement('div');
        newRow.className = 'input-group input-group-lg mb-2 source-group';
        newRow.innerHTML = `
            <input type="text" class="form-control source-name-input" placeholder="이름">
            <input type="text" class="form-control source-url-input" placeholder="URL (선택사항)">
            <button type="button" class="btn btn-outline-danger" onclick="this.closest('.source-group').remove()">삭제</button>
        `;
        container.appendChild(newRow);
    }

    async function updateMetadata(id) {
        const title = document.getElementById(`edit-title-${id}`).value;
        const summary = document.getElementById(`edit-summary-${id}`).value;
        const playTime = parseInt(document.getElementById(`edit-playtime-${id}`).value, 10);
        const categoryId = parseInt(document.getElementById(`edit-category-id-${id}`).value, 10);

        const sourcesContainer = document.getElementById(`edit-sources-container-${id}`);
        const sourceGroups = sourcesContainer.querySelectorAll('.source-group');
        const sources = Array.from(sourceGroups).map(group => {
            const nameInput = group.querySelector('.source-name-input');
            const urlInput = group.querySelector('.source-url-input');
            const name = nameInput?.value.trim() || '';
            const url = urlInput?.value.trim();

            return {
                sourceName: name,
                sourceUrl: url === '' ? null : url
            };
        })
            .filter(s => s.sourceName.trim() !== '');

        const originalAudioUrl = document.getElementById(`original-audio-url-${id}`).value;
        const shortAudioUrl = document.getElementById(`short-audio-url-${id}`).value;
        const scriptUrl = document.getElementById(`script-url-${id}`).value;

        const updated = {
            title,
            summary,
            playTime,
            sources,
            categoryId,
            originalAudioUrl,
            shortAudioUrl,
            scriptUrl
        };

        try {
            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
            const response = await fetch(`/api/v1/admin/hearits/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(updated)
            });
            if (response.ok) {
                alert('수정되었습니다.');
                editingId = null;
                const modalEl = document.getElementById('editHearitModal');
                const instance = bootstrap.Modal.getInstance(modalEl);
                if (instance) {
                    instance.hide();
                }
                fetchHearits(currentPage);
            } else {
                const err = await response.json();
                alert('수정 실패: ' + (err.message || '오류 발생'));
            }
        } catch (e) {
            console.error('Update error:', e);
            alert('수정 중 오류가 발생했습니다.');
        }
    }

    async function updateFile(event, id, type) {
        event.preventDefault();
        const form = event.target;
        const fileInput = form.querySelector('input[type="file"]');
        if (!fileInput.files.length) {
            alert('파일을 선택해주세요.');
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const url = `/api/v1/admin/hearits/${id}/${type}`;

        try {
            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    [csrfHeader]: csrfToken
                },
                body: formData
            });

            if (response.ok) {
                alert(`파일이 성공적으로 수정되었습니다.`);
                fetchHearits(currentPage);

            } else {
                const err = await response.json();
                alert('파일 수정 실패: ' + (err.detail || '서버 오류 발생'));
            }
        } catch (e) {
            console.error('File update error:', e);
            alert('파일 수정 중 오류가 발생했습니다.');
        }
    }

    function cancelEditHearit() {
        editingId = null;
        const modalEl = document.getElementById('editHearitModal');
        const instance = bootstrap.Modal.getInstance(modalEl);
        if (instance) {
            instance.hide();
        }
        fetchHearits(currentPage);
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchHearits(0);
    });
</script>
</body>
</html>
