# ==================================
# global common-dev config
# ==================================
# secret import
spring.config.import=optional:file:.env[.properties]

# Dev-DataSource
spring.datasource.url=jdbc:mysql://${MYSQL_WRITER_ENDPOINT}:${MYSQL_PORT}/${MYSQL_DATABASE}?rewriteBatchedStatements=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_WRITER}
spring.datasource.password=${MYSQL_WRITER_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dev-JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# S3
aws.s3.bucket=${AMAZON_S3_BUCKET_URL}
amazon.s3.bucket=${AMAZON_S3_BUCKET_URL}
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-part-count=30

# Jwt
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}

# kakao base-url
kakao.user-info.base-url=https://kapi.kakao.com
kakao.user-info.connectTimeout=2s
kakao.user-info.readTimeout=3s

# user-default-image
hearit.profile.default-image-url=http://hearit.o-r.kr/images/default-profile.jpg

# Server Time
spring.jackson.time-zone=Asia/Seoul

# logging
logging.config=classpath:log4j2/log4j2.xml
server.forward-headers-strategy=native

# Flyaway
spring.flyway.user=${MYSQL_MIGRATION_USER}
spring.flyway.password=${MYSQL_MIGRATION_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Prometheus
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.tags.application=hearit
management.metrics.tags.env=${ENV}
