# ==================================
# global common-dev config
# ==================================
# secret import
spring.config.import=optional:file:.env[.properties]

# DataSource
# ==================================
# Master (Primary)
# ==================================
spring.datasource.master.jdbc-url=jdbc:mysql://${MYSQL_WRITER_ENDPOINT}:${MYSQL_WRITER_PORT}/${MYSQL_DATABASE}?rewriteBatchedStatements=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.master.username=${MYSQL_WRITER_USERNAME}
spring.datasource.master.password=${MYSQL_WRITER_PASSWORD}
spring.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.master.maximum-pool-size=8
spring.datasource.master.data-source-properties.cachePrepStmts=true
spring.datasource.master.data-source-properties.prepStmtCacheSize=250
spring.datasource.master.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.master.data-source-properties.useServerPrepStmts=true
spring.datasource.master.data-source-properties.useLocalSessionState=true
spring.datasource.master.data-source-properties.cacheResultSetMetadata=true
spring.datasource.master.hikari.leak-detection-threshold=20000
spring.datasource.master.hikari.connection-timeout=5000
spring.datasource.master.hikari.validation-timeout=3000
spring.datasource.master.hikari.keepalive-time=300000

# ==================================
# Replica
# ==================================
spring.datasource.replica.jdbc-url=jdbc:mysql://${MYSQL_READER_ENDPOINT}:${MYSQL_READER_PORT}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.replica.username=${MYSQL_READER_USERNAME}
spring.datasource.replica.password=${MYSQL_READER_PASSWORD}
spring.datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.replica.maximum-pool-size=8
spring.datasource.replica.data-source-properties.cachePrepStmts=true
spring.datasource.replica.data-source-properties.prepStmtCacheSize=250
spring.datasource.replica.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.replica.data-source-properties.useServerPrepStmts=true
spring.datasource.replica.data-source-properties.cacheResultSetMetadata=true
spring.datasource.replica.hikari.leak-detection-threshold=20000
spring.datasource.replica.hikari.connection-timeout=5000
spring.datasource.replica.hikari.validation-timeout=3000
spring.datasource.replica.hikari.keepalive-time=300000

# Tomcat
server.tomcat.threads.max=6
server.tomcat.threads.min-spare=3

server.tomcat.max-connections=300
server.tomcat.accept-count=100

server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=65000

server.tomcat.accesslog.enabled=false
server.compression.enabled=false

spring.cache.type=caffeine
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

server.tomcat.mbeanregistry.enabled=true

# Dev-JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# S3
aws.s3.bucket=${S3_BUCKET}
aws.s3.bucket.url=${AMAZON_S3_BUCKET_URL}
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-part-count=30

# Jwt
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}

# kakao base-url
kakao.user-info.base-url=https://kapi.kakao.com
kakao.user-info.connectTimeout=2s
kakao.user-info.readTimeout=3s

# user-default-image
hearit.profile.default-image-url=http://hearit.o-r.kr/images/default-profile.jpg

# Server Time
spring.jackson.time-zone=Asia/Seoul

# logging
logging.config=classpath:log4j2/log4j2.xml
server.forward-headers-strategy=native
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.onair.hearit.core.log.dbtrace.HibernateQueryInspector

# Flyaway
spring.flyway.url=jdbc:mysql://${MYSQL_WRITER_ENDPOINT}:${MYSQL_PORT}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.flyway.user=${MYSQL_MIGRATION_USER}
spring.flyway.password=${MYSQL_MIGRATION_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Prometheus
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.tags.application=hearit
management.metrics.tags.env=${ENV}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

playing-history.lock.wait-time=1000
playing-history.lock.lease-time=3000

# ==================================
# AI Processing (OpenAI Whisper + Gemini)
# ==================================
openai.api.key=${OPENAI_API_KEY}
openai.whisper.model=whisper-1

gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.0-flash

# AI 처리 설정
ai.result.expiration.hours=24
ai.shorts.duration.seconds=60
ai.max-file-size-mb=25

# S3 임시 경로
aws.s3.temp.prefix=hearit/temp/
