plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation project(':app')
    implementation project(':admin')
}

tasks.named('bootJar') {
    enabled = true

    from(project(':admin').file('src/main/resources/templates/admin')) {
        into 'templates/admin'
    }

    dependsOn project(':app').tasks.named('generateSwaggerUISample')
    from("${project(':app').tasks.generateSwaggerUISample.outputDir}") {
        into 'BOOT-INF/classes/static/swagger-ui'
    }
}
